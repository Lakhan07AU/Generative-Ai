[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q
# Put tests/ on sys.path so helper modules (helpers.py) are importable even
# though the suite is packaged under tests/__init__.py
pythonpath = tests
# Avoid collecting the virtual environments
norecursedirs = .venv venv node_modules .next __pycache__ frontend backend/.venv
